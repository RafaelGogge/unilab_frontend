<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Metadados básicos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rafael V. Gogge">
    <meta name="copyright" content="© 2025 Rafael V. Gogge">
    <title>Informações de Login</title>

    <!-- Folhas de estilo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Cabeçalho da página -->
    <header class="header text-center">
        <h1>Informações de Login</h1>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <div class="container mt-5">
            <!-- Título da seção -->
            <h2 class="text-center">Login do Usuário</h2>

            <!-- Box de informações do login -->
            <div id="loginInfo" class="alert alert-info text-center">
                <p><strong>Login:</strong> <span id="userLogin"></span></p>
                <p><strong>Senha:</strong> <span id="userPassword"></span></p>
            </div>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="footer text-center mt-5">
        <p>&copy; 2025 UniLab. Todos os direitos reservados.</p>
    </footer>

    <!-- Scripts -->
    <script>
        /**
         * Desenvolvido por Rafael V. Gogge
         * © 2025 - Todos os direitos reservados
         * GitHub: https://github.com/RafaelGogge
         */

        // Função para obter parâmetros da URL
        function getQueryParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                login: urlParams.get('login'),
                password: urlParams.get('password')
            };
        }

        // Função para exibir os dados de login ao carregar a página
        window.onload = function () {
            const params = getQueryParams();
            document.getElementById("userLogin").textContent = params.login;
            document.getElementById("userPassword").textContent = params.password;
        };
    </script>
</body>

</html>
